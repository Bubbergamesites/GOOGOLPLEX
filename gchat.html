    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Animated Background Canvas */
        #network {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.8;
        }

        /* Glassmorphism Styling */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #64ffcc, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(100, 255, 204, 0.5);
            letter-spacing: 2px;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        nav a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            position: relative;
        }

        nav a:hover {
            color: #64ffcc;
            text-shadow: 0 0 20px rgba(100, 255, 204, 0.8);
        }

        .status-badge {
            background: rgba(100, 255, 204, 0.1);
            border: 1px solid rgba(100, 255, 204, 0.3);
            color: #64ffcc;
            padding: 6px 14px;
            border-radius: 50px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        /* Main Chat Layout */
        .chat-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1000px;
            width: 100%;
            margin: 90px auto 20px auto;
            height: calc(100vh - 110px);
            padding: 0 20px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            border-radius: 20px 20px 0 0;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(100, 255, 204, 0.3);
            border-radius: 10px;
        }

        /* Messages */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            line-height: 1.5;
            font-size: 0.98rem;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(100, 255, 204, 0.15));
            border: 1px solid rgba(100, 255, 204, 0.3);
            border-radius: 20px 20px 0px 20px;
            padding: 15px 20px;
            color: #fff;
        }

        .message.assistant {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px 20px 20px 0px;
            padding: 15px 20px;
            color: #e0e0e0;
        }

        .message-sender {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user .message-sender {
            color: #64ffcc;
            text-align: right;
        }

        .assistant .message-sender {
            color: #00d4ff;
        }

        /* Input Controls */
        .chat-input-wrapper {
            border-radius: 0 0 20px 20px;
            padding: 15px;
            border-top: none;
        }

        .chat-input-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 20px;
            color: #fff;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            resize: none;
            max-height: 120px;
            height: 48px;
        }

        .chat-input-box textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .send-btn {
            background: linear-gradient(135deg, #64ffcc, #00d4ff);
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            height: 48px;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(100, 255, 204, 0.5);
        }
    </style>
</head>

        <a href="index.html" class="logo">GOOGOLPLEX</a>

            </div>
        </div>
    </div>
